<?xml version="1.0" encoding="UTF-8"?>
<!-- AI Usage Tracker panel glyph: paired four-point sparkles on a 16x16
  grid. Full-color (GNOME blue + purple) so it stays visible on both
  light and dark top bars without relying on symbolic recoloring, which
  does not apply to GFileIcon SVGs (the old #2e3436 symbolic glyph
  rendered dark-on-dark and looked like "percentage only").
  Large star spans x 1-11 / y 2-12, small star x 9.3-15.1 / y 8.9-14.7. -->
<svg height="16px" viewBox="0 0 16 16" width="16px" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(0 -0.5)">
    <path d="M 6 2 L 7.3 5.7 L 11 7 L 7.3 8.3 L 6 12 L 4.7 8.3 L 1 7 L 4.7 5.7 Z" fill="#3584e9"/>
    <path d="M 12.2 8.9 L 13 11 L 15.1 11.8 L 13 12.6 L 12.2 14.7 L 11.4 12.6 L 9.3 11.8 L 11.4 11 Z" fill="#c061cb"/>
  </g>
</svg>
